<style>

</style>
</head>

function nl(s){return esc(s).replace(/\n/g,'<br>')}

else if(current===2){h='<div class="de-pad"><div class="center"><div class="h2">지금, 나에게<br>부족한 기운은 무엇인가요?</div><div class="small" style="margin-top:1.5%">왼쪽에서 현재 흐름을 보고, 오른쪽에서 추천 원석을 확인하세요.</div></div><div class="map-list">'+p.needs.map((n,i)=>'<div class="map-item"><div class="num">0'+(i+1)+'</div><div class="mapbox" style="background:'+C[i]+'15;color:'+C[i]+'"><b>'+['목','화','토','금','수'][i]+'이 부족할 때</b><br>'+esc(n)+'</div><div class="arrow">→</div><div class="mapbox"><b>추천 원석</b><br>'+esc(p.stones[i])+'</div></div>').join('')+'</div></div>'}
else if(current===3){h='<div class="de-pad"><div class="center"><div class="eyebrow">CHOOSING GUIDE</div><div class="h2" style="margin-top:1.5%">'+nl(p.headline)+'</div><div class="body" style="margin-top:1.2%">'+esc(p.sub)+'</div></div><div class="info-box" style="margin-top:2.5%"><div class="small"><b>GUIDE TIP</b><br>'+esc(p.tip)+'</div></div><div class="guide-flow">'+p.steps.map((s,i)=>'<div class="guide-card"><div class="guide-num">0'+(i+1)+'</div><div class="h3">'+esc(s[0])+'</div><div class="small" style="margin-top:4%">'+esc(s[1])+'</div></div>').join('')+'</div><div class="image-stage">'+media(p.image,'오행 가이드 제품 이미지')+'<div class="image-caption"><div class="badge"><b>오행 천연석</b><br>각 오행을 상징하는 원석</div><div class="badge"><b>비휴 포인트</b><br>복과 재물을 지키는 상징</div></div></div></div>'}

async function saveCurrent(){const scale=current===0?1000/canvas.getBoundingClientRect().width:1000/canvas.getBoundingClientRect().width;const c=await html2canvas(canvas,{scale:scale,useCORS:true,backgroundColor:'#fff'});const a=document.createElement('a');a.download='detail_page_'+String(current+1).padStart(2,'0')+'.jpg';a.href=c.toDataURL('image/jpeg',.95);a.click()}
document.getElementById('save-page').addEventListener('click',saveCurrent);document.getElementById('prev').addEventListener('click',()=>{current=Math.max(0,current-1);addNav();renderEditor();renderPreview()});document.getElementById('next').addEventListener('click',()=>{current=Math.min(14,current+1);addNav();renderEditor();renderPreview()});
addNav();renderEditor();renderPreview();
})();
